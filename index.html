<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chime Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the Inter font and overall aesthetics */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            margin: 0;
            padding: 1rem; /* Add some padding for smaller screens */
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff; /* White background for the card */
            border-radius: 1.5rem; /* More rounded corners */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Soft shadow */
            padding: 2rem;
            width: 100%;
            max-width: 28rem; /* Max width for larger screens */
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* Space between elements */
        }
        .time-input-group {
            display: flex;
            justify-content: center;
            gap: 1rem; /* Space between minute and second inputs */
        }
        .time-input-group > div {
            flex: 1; /* Allow inputs to take equal space */
        }
        input[type="number"] {
            border: 2px solid #cbd5e1; /* Light gray border */
            border-radius: 0.75rem; /* Rounded input corners */
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 1.125rem; /* Larger font size */
            text-align: center;
            transition: border-color 0.2s ease-in-out;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #6366f1; /* Indigo on focus */
        }
        .button-group {
            display: flex;
            gap: 1rem; /* Space between buttons */
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
            justify-content: center;
        }
        .btn {
            flex-grow: 1; /* Allow buttons to grow and fill space */
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem; /* Rounded button corners */
            font-weight: 600; /* Semi-bold text */
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Button shadow */
            min-width: 120px; /* Minimum width for buttons */
        }
        .btn-primary {
            background-color: #6366f1; /* Indigo */
            color: white;
        }
        .btn-primary:hover {
            background-color: #4f46e5; /* Darker indigo on hover */
            transform: translateY(-2px); /* Slight lift effect */
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .btn-secondary {
            background-color: #ef4444; /* Red */
            color: white;
        }
        .btn-secondary:hover {
            background-color: #dc2626; /* Darker red on hover */
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .timer-display {
            font-size: 3rem; /* Large font for timer */
            font-weight: 700; /* Bold */
            color: #1f2937; /* Dark gray */
            margin-top: 1rem;
        }
        .message-box {
            background-color: #e0f2fe; /* Light blue */
            color: #0c4a6e; /* Darker blue text */
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 2.5rem; /* Ensure it has some height even when empty */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; /* Initially hidden */
            transition: opacity 0.3s ease-in-out;
        }
        .message-box.show {
            opacity: 1;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                border-radius: 1rem;
            }
            .timer-display {
                font-size: 2.5rem;
            }
            .btn {
                width: 100%; /* Full width buttons on very small screens */
                flex-grow: unset;
            }
            .button-group {
                flex-direction: column; /* Stack buttons vertically */
            }
            .time-input-group {
                flex-direction: column; /* Stack input fields vertically */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Chime Timer</h1>

        <div class="flex flex-col items-center gap-4">
            <label class="text-gray-600 text-lg">Set timer for:</label>
            <div class="time-input-group">
                <div>
                    <input type="number" id="minutesInput" placeholder="Minutes" min="0" value="0">
                    <label for="minutesInput" class="text-gray-500 text-sm">Minutes</label>
                </div>
                <div>
                    <input type="number" id="secondsInput" placeholder="Seconds" min="0" max="59" value="0">
                    <label for="secondsInput" class="text-gray-500 text-sm">Seconds</label>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button id="startChimeBtn" class="btn btn-primary">Start Chime</button>
            <button id="stopChimeBtn" class="btn btn-secondary" disabled>Stop Chime</button>
        </div>

        <div id="timerDisplay" class="timer-display">00:00</div>

        <div id="messageBox" class="message-box"></div>
    </div>

    <script>
        // Get references to DOM elements
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const startChimeBtn = document.getElementById('startChimeBtn');
        const stopChimeBtn = document.getElementById('stopChimeBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const messageBox = document.getElementById('messageBox');

        let timerInterval; // Stores the interval ID for the timer
        let endTime; // Stores the timestamp when the chime should play
        let isTimerRunning = false; // Flag to track timer state
        let audioContext = null; // Declare audioContext globally

        // Function to initialize or resume the AudioContext
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Check if context is suspended and resume if necessary
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    console.log('AudioContext resumed successfully');
                }).catch(e => {
                    console.error('Error resuming AudioContext:', e);
                });
            }
        }

        // Function to play a short chime sound
        function playChime() {
            console.log("Attempting to play chime...");
            try {
                // Ensure audio context is active before playing
                initAudioContext();

                // Create an oscillator node (sound source)
                const oscillator = audioContext.createOscillator();
                oscillator.type = 'sine'; // Sine wave for a clean tone
                oscillator.frequency.setValueAtTime(880, audioContext.currentTime); // A4 note (880 Hz)

                // Create a gain node (volume control)
                const gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(0.5, audioContext.currentTime); // Start at 50% volume

                // Connect oscillator to gain node, and gain node to destination (speakers)
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Schedule the volume to decay quickly for a short chime effect
                // Decay time is 2.0 seconds for a longer chime
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 2.0);

                // Start the oscillator
                oscillator.start(audioContext.currentTime);

                // Stop the oscillator after a short duration
                // Stop time is 2.1 seconds (slightly after decay)
                oscillator.stop(audioContext.currentTime + 2.1);

            } catch (error) {
                console.error("Error playing chime:", error);
                showMessage("Failed to play chime sound. Your browser might not support Web Audio API or has restrictions.", "error");
            }
        }

        // Function to display messages to the user
        function showMessage(message, type = "info") {
            messageBox.textContent = message;
            messageBox.className = 'message-box show'; // Show the box
            if (type === "error") {
                messageBox.classList.add('bg-red-100', 'text-red-800');
            } else {
                messageBox.classList.add('bg-blue-100', 'text-blue-800');
            }
            // Hide message after 3 seconds
            setTimeout(() => {
                messageBox.classList.remove('show');
                messageBox.classList.remove('bg-red-100', 'text-red-800', 'bg-blue-100', 'text-blue-800');
            }, 3000);
        }

        // Function to update the timer display
        function updateDisplay() {
            const now = Date.now();
            const remainingTimeMs = endTime - now;

            if (remainingTimeMs <= 0) {
                // Timer finished
                clearInterval(timerInterval);
                timerDisplay.textContent = "00:00";
                playChime(); // Play chime when timer is done
                showMessage("Time's up! Chime played.", "info");
                isTimerRunning = false;
                startChimeBtn.disabled = false;
                stopChimeBtn.disabled = true;
                minutesInput.disabled = false;
                secondsInput.disabled = false;
                return;
            }

            const totalSeconds = Math.floor(remainingTimeMs / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            // Format minutes and seconds with leading zeros
            const formattedMinutes = String(minutes).padStart(2, '0');
            const formattedSeconds = String(seconds).padStart(2, '0');

            timerDisplay.textContent = `${formattedMinutes}:${formattedSeconds}`;
        }

        // Function to start the chime timer
        function startChime() {
            if (isTimerRunning) {
                showMessage("Timer is already running.", "info");
                return;
            }

            const minutes = parseInt(minutesInput.value, 10);
            const seconds = parseInt(secondsInput.value, 10);

            // Validate inputs
            if (isNaN(minutes) || minutes < 0 || isNaN(seconds) || seconds < 0 || seconds > 59) {
                showMessage("Please enter valid numbers for minutes (>=0) and seconds (0-59).", "error");
                return;
            }

            const totalDurationSeconds = (minutes * 60) + seconds;

            if (totalDurationSeconds <= 0) {
                showMessage("Please set a timer duration greater than zero.", "error");
                return;
            }

            // Initialize/resume AudioContext on user interaction
            initAudioContext();

            // Calculate the end time
            endTime = Date.now() + (totalDurationSeconds * 1000);

            // Start the interval to update the display
            timerInterval = setInterval(updateDisplay, 1000);
            isTimerRunning = true;

            // Disable start button and inputs, enable stop button
            startChimeBtn.disabled = true;
            stopChimeBtn.disabled = false;
            minutesInput.disabled = true;
            secondsInput.disabled = true;

            showMessage(`Timer set for ${minutes} minute(s) and ${seconds} second(s).`);
            updateDisplay(); // Initial display update
        }

        // Function to stop the chime timer
        function stopChime() {
            if (!isTimerRunning) {
                showMessage("No timer is currently running.", "info");
                return;
            }

            clearInterval(timerInterval);
            timerDisplay.textContent = "00:00";
            isTimerRunning = false;
            startChimeBtn.disabled = false;
            stopChimeBtn.disabled = true;
            minutesInput.disabled = false;
            secondsInput.disabled = false;
            showMessage("Timer stopped.");
        }

        // Event Listeners
        startChimeBtn.addEventListener('click', startChime);
        stopChimeBtn.addEventListener('click', stopChime);

        // Initial display reset and pre-fill on load
        window.onload = function() {
            timerDisplay.textContent = "00:00";
            minutesInput.value = "0"; // Set minutes to 0 by default
            secondsInput.value = "0"; // Set seconds to 0 by default
        };
    </script>
</body>
</html>
